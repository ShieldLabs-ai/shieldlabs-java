name: Release

# Publishes to Maven Central when a maintainer pushes a tag such as v1.0.0 that matches the version
# in pom.xml. Re-running the workflow for the same tag is safe: a version that is already on Maven
# Central is not uploaded again, and an existing GitHub release gets its files replaced.
#
# Secrets of the "release" environment:
#   MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD  (Central Portal user token)
#   MAVEN_GPG_PRIVATE_KEY, MAVEN_GPG_PASSPHRASE     (signing key, ASCII armored)

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Check that the tag matches the project version
        run: |
          version="$(mvn -B -ntp -q org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version ${version}" >&2
            exit 1
          fi

      - name: Build, test, coverage and javadoc
        run: mvn -B -ntp verify

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jars
          path: target/shieldlabs-java-*.jar
          if-no-files-found: error

  publish:
    name: Publish to Maven Central
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Check whether this version is already on Maven Central
        id: central
        run: |
          version="${GITHUB_REF_NAME#v}"
          url="https://repo1.maven.org/maven2/ai/shieldlabs/shieldlabs-java/${version}/shieldlabs-java-${version}.pom"
          status="$(curl -s -o /dev/null -w '%{http_code}' "${url}")"
          if [ "${status}" = "200" ]; then
            echo "shieldlabs-java ${version} is already on Maven Central; skipping the upload."
            echo "published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi

      # The build job ran the tests. If a re-run reaches this step shortly after an earlier upload,
      # Maven Central rejects the duplicate until the files are visible on repo1; re-run again later.
      - name: Build, sign and publish to Maven Central
        if: steps.central.outputs.published != 'true'
        run: mvn -B -ntp -Prelease -DskipTests deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jars
          path: dist

      - name: Create the GitHub release, or update its files
        run: |
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${TAG}" dist/*.jar --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" dist/*.jar --repo "${GITHUB_REPOSITORY}" --verify-tag \
              --title "${TAG}" --notes "See CHANGELOG.md for the changes in this release."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
